name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.x'

      - name: Install dependencies
        run: nimble install -y

      - name: Create test database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "CREATE DATABASE necto_test;"

      - name: Run migrations
        env:
          NECTO_HOST: localhost
          NECTO_USER: postgres
          NECTO_PASSWORD: postgres
          NECTO_DATABASE: necto_test
        run: nimble migrate

      - name: Run tests
        env:
          NECTO_HOST: localhost
          NECTO_USER: postgres
          NECTO_PASSWORD: postgres
          NECTO_DATABASE: necto_test
        run: nimble test
